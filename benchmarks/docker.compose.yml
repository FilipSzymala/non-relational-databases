name: nbd-cache-benchmarks

services:
    mongo:
        image: mongo:8.0
        ports:
            - "127.0.0.1:27027:27017"
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 2s
            timeout: 5s
            retries: 30
    redis:
        image: redis/redis-stack:7.4.0-v3
        ports:
            - "127.0.0.1:6380:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 2s
            timeout: 5s
            retries: 30
