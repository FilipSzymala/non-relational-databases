name: mongo_nbd_ex2

services:
    mongo_1:
        build: .
        image: mongo_nbd_ex2:9.0.4
        container_name: mongodb1
        hostname: mongodb1
        networks:
            - mongonet
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongo-db-data-1:/data/db
            - mongo-configdb-data-1:/data/configdb
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=adminpassword
            - MONGO_INITDB_DATABASE=rentacar
        command: --config /etc/mongod.conf --port 27017
        healthcheck:
            test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    mongo_2:
        build: .
        image: mongo_nbd_ex2:9.0.4
        container_name: mongodb2
        hostname: mongodb2
        networks:
            - mongonet
        ports:
            - "127.0.0.1:27018:27018"
        volumes:
            - mongo-db-data-2:/data/db
            - mongo-configdb-data-2:/data/configdb
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=adminpassword
            - MONGO_INITDB_DATABASE=rentacar
        command: --config /etc/mongod.conf --port 27018
        healthcheck:
            test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    mongo_3:
        build: .
        image: mongo_nbd_ex2:9.0.4
        container_name: mongodb3
        hostname: mongodb3
        networks:
            - mongonet
        ports:
            - "127.0.0.1:27019:27019"
        volumes:
            - mongo-db-data-3:/data/db
            - mongo-configdb-data-3:/data/configdb
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=adminpassword
            - MONGO_INITDB_DATABASE=rentacar
        command: --config /etc/mongod.conf --port 27019
        healthcheck:
            test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 5

    mongoinit:
        build: .
        image: mongo_nbd_ex2:9.0.4
        hostname: mongodbinit
        container_name: mongodbinit
        networks:
            - mongonet
        depends_on:
            mongo_1:
                condition: service_healthy
            mongo_2:
                condition: service_healthy
            mongo_3:
                condition: service_healthy
        command: >
            mongosh --host mongodb1:27017
            --username admin
            --password adminpassword
            --authenticationDatabase admin
            --eval '
              rs.initiate({
                _id: "replica_set_single",
                version: 1,
                members: [
                  { _id: 0, host: "mongodb1:27017" },
                  { _id: 1, host: "mongodb2:27018" },
                  { _id: 2, host: "mongodb3:27019" }
                ]
              });
            '

networks:
    mongonet: {}

volumes:
    mongo-db-data-1:
    mongo-configdb-data-1:
    mongo-db-data-2:
    mongo-configdb-data-2:
    mongo-db-data-3:
    mongo-configdb-data-3:
